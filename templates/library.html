{% extends "layout.html" %}

{% block title%} Library {% endblock %}
{% block body %}
<h1>Library</h1>
<p>Welcome to your library</p>
<table>
    <thead>
        <tr>
            <th>Image</th>
            <th>Name</th>
            <th>Status</th>
            <th>Your progress</th>
            <th>Latest Update</th>
            <th>Action</th>
            <th>Remove</th>
        </tr>
    </thead>
    <tbody>
        {% for row in rows %}
        <tr>
            <!-- Image -->
            <td>
                <img src="{{ row[3] }}" alt="{{ row[2] }}">
            </td>
            <!-- Name -->
            <td> {{ row[2] }} </td>
            <!-- Status -->
            <td> {{ row[4] }} </td>
            <!-- Your Progress -->
            <td>
                <!-- Back Pill -->
                <form action = "/progress" method = "post">
                    <input name = "id" value="{{ row[1] }}" type="hidden">
                    <input name = "action" value="decrease" type="hidden">
                    <input name = "season" value=" {{ row[6]}}" type="hidden">
                    <input name = "episode" value=" {{ row[7]}}" type="hidden">
                    <button type="submit" class="btn btn-primary btn-sm">-1 Episode</button>
                </form>
                <!-- Button -->
                <button type="button" class="button" onclick="togglePopup(this)">
                    {% if row[6] and row[7] %}
                    Season {{ row[6] }} Episode {{ row[7] }}
                    {% else %}
                    Not Started
                    {% endif %}
                </button>
                <div class="popup">
                    <form action = "/progress" method="post">
                        <input name = "id" value = "{{row[1]}}" type="hidden">
                        
                    </form>
                </div>
                <!-- Forward Pill -->
                <form action = "/progress" method = "post">
                    <input name = "id" value="{{ row[1] }}" type="hidden">
                    <input name = "action" value="increase" type="hidden">
                    <input name = "season" value=" {{ row[6]}}" type="hidden">
                    <input name = "episode" value=" {{ row[7]}}" type="hidden">
                    <button type="submit" class="btn btn-primary btn-sm">+1 Episode</button>
                </form>
            </td>
            <!-- Latest Update -->
            <td> TODO </td>
            <!-- Action -->
            <td>
                <form action="/details" method="get">
                    <input name="id" type="hidden" value="{{ row[1] }}">
                    <button type="submit">See More</button>
                </form>
            </td>
            <td>
                <form action="/remove" method="post">
                    <input name="remove" type="hidden" value="{{ row[1] }}">
                    <button type="submit">Remove</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
